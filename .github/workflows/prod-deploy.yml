# @format

name: Deploy Production

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

env:
  APP_NAME: soma-server
  DEPLOY_PATH: /opt/soma-server
  DEPLOY_USER: ubuntu
  # Default location used by Bun's Linux installer for the ubuntu deploy user.
  # Change this if Bun was installed system-wide or under a different user.
  BUN_BIN: /home/ubuntu/.bun/bin/bun

jobs:
  build-and-migrate:
    name: Build and run migrations
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx --bun prisma generate

      - name: Build
        run: bun run build

      # `migrate deploy` is idempotent: it applies only migrations that have not
      # already been recorded in the production database.
      - name: Run Prisma migrations
        run: bunx --bun prisma migrate deploy

      - name: Package release
        run: |
          tar -czf "$APP_NAME-${GITHUB_SHA}.tgz" \
            dist \
            package.json \
            bun.lock \
            src/prisma/schema.prisma \
            src/prisma/migrations

      - name: Upload release
        uses: actions/upload-artifact@v4
        with:
          name: soma-server-release
          path: soma-server-${{ github.sha }}.tgz
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to EC2
    needs: build-and-migrate
    runs-on: ubuntu-latest

    steps:
      - name: Download release
        uses: actions/download-artifact@v4
        with:
          name: soma-server-release

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          : "${DEPLOY_SSH_KEY:?Add the DEPLOY_SSH_KEY repository secret.}"
          : "${EC2_HOST:?Add the EC2_HOST repository secret.}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$EC2_HOST" true

      - name: Upload and activate release
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          release_dir="$DEPLOY_PATH/releases/$GITHUB_SHA"
          ssh "$DEPLOY_USER@$EC2_HOST" "mkdir -p '$release_dir'"
          scp "$APP_NAME-$GITHUB_SHA.tgz" "$DEPLOY_USER@$EC2_HOST:$release_dir/release.tgz"
          ssh "$DEPLOY_USER@$EC2_HOST" "set -eu; '$BUN_BIN' --version; cd '$release_dir'; tar -xzf release.tgz; rm release.tgz; '$BUN_BIN' install --production --frozen-lockfile; ln -sfn '$release_dir' '$DEPLOY_PATH/current'; sudo systemctl restart '$APP_NAME'"

      - name: Verify service is running
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh "$DEPLOY_USER@$EC2_HOST" "sudo systemctl is-active --quiet '$APP_NAME'; if ! curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 2 -X POST -H 'Content-Type: application/json' --data '{\"query\":\"{__typename}\"}' http://127.0.0.1:8000/api/v1/graphql > /dev/null; then sudo journalctl -u '$APP_NAME' -n 100 --no-pager; exit 1; fi"
